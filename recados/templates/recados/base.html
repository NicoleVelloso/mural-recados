{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{% block titulo %}Mural de Recados{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'recados/estilo.css' %}">
</head>
<body>
    <nav class="menu">
        <div class="menu-esq">
            <a href="{% url 'home' %}">Início</a>
            <a href="{% url 'mural' %}">Mural</a>
            {% if user.is_authenticated %}
                <a href="{% url 'novo_recado' %}">Novo Recado</a>
                <a href="{% url 'meus_recados' %}">Meus Recados</a>
            {% endif %}
        </div>
        <div class="menu-dir">
            {% if user.is_authenticated %}
                <span class="ola">Olá, {{ user.username }}</span>
                <a href="{% url 'sair' %}">Sair</a>
            {% else %}
                <a href="{% url 'entrar' %}">Entrar</a>
                <a href="{% url 'cadastro' %}">Criar conta</a>
            {% endif %}
        </div>
    </nav>

    <main>
        {% block conteudo %}{% endblock %}
    </main>
</body>
</html>
