{% extends "recados/base.html" %}

{% block titulo %}Excluir Recado{% endblock %}

{% block conteudo %}
    <h1>Excluir Recado</h1>

    <p>Tem certeza de que deseja excluir este recado?</p>

    <div class="recado">
        <p>{{ recado.mensagem }}</p>
        <p class="data">{{ recado.criado_em }}</p>
    </div>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="botao-perigo">Sim, excluir</button>
        <a class="botao" href="{% url 'meus_recados' %}">Cancelar</a>
    </form>
{% endblock %}
