{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Editar Recado</title>
    <link rel="stylesheet" href="{% static 'recados/estilo.css' %}">
</head>
<body>
    <h1>Editar Recado</h1>

    <a class="botao" href="{% url 'meus_recados' %}">Voltar aos meus recados</a>

    {% if erro %}
        <p class="erro">{{ erro }}</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <label for="mensagem">Mensagem:</label>
        <textarea id="mensagem" name="mensagem" required>{{ mensagem|default:recado.mensagem }}</textarea>

        <button type="submit">Salvar alterações</button>
    </form>
</body>
</html>
