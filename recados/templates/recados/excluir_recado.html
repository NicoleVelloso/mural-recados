{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Excluir Recado</title>
    <link rel="stylesheet" href="{% static 'recados/estilo.css' %}">
</head>
<body>
    <h1>Excluir Recado</h1>

    <p>Tem certeza de que deseja excluir este recado?</p>

    <div class="recado">
        <p>{{ recado.mensagem }}</p>
        <p class="data">{{ recado.criado_em }}</p>
    </div>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="botao-perigo">Sim, excluir</button>
        <a class="botao" href="{% url 'meus_recados' %}">Cancelar</a>
    </form>
</body>
</html>
