{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Entrar</title>
    <link rel="stylesheet" href="{% static 'recados/estilo.css' %}">
</head>
<body>
    <h1>Entrar</h1>

    <a class="botao" href="{% url 'mural' %}">Voltar ao mural</a>

    {% if form.errors %}
        <p class="erro">Usuário ou senha inválidos. Tente novamente.</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Entrar</button>
    </form>

    <p class="rodape">Não tem conta? <a href="{% url 'cadastro' %}">Cadastre-se</a></p>
</body>
</html>
