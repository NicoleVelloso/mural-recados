{% extends "recados/base.html" %}

{% block titulo %}Criar conta{% endblock %}

{% block conteudo %}
    <h1>Criar conta</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Cadastrar</button>
    </form>

    <p class="rodape">Já tem conta? <a href="{% url 'entrar' %}">Entrar</a></p>
{% endblock %}
