{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Novo Recado</title>
    <link rel="stylesheet" href="{% static 'recados/estilo.css' %}">
</head>
<body>
    <h1>Novo Recado</h1>

    <a class="botao" href="{% url 'mural' %}">Voltar ao mural</a>

    {% if erro %}
        <p class="erro">{{ erro }}</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" value="{{ nome|default:'' }}" required>

        <label for="mensagem">Mensagem:</label>
        <textarea id="mensagem" name="mensagem" required>{{ mensagem|default:'' }}</textarea>

        <button type="submit">Publicar recado</button>
    </form>
</body>
</html>
