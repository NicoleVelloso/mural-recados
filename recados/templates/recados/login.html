{% extends "recados/base.html" %}

{% block titulo %}Entrar{% endblock %}

{% block conteudo %}
    <h1>Entrar</h1>

    {% if form.errors %}
        <p class="erro">Usuário ou senha inválidos. Tente novamente.</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Entrar</button>
    </form>

    <p class="rodape">Não tem conta? <a href="{% url 'cadastro' %}">Cadastre-se</a></p>
{% endblock %}
